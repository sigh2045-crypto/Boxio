<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOXIO - العناوين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--card:#fff;--text:#212529;--muted:#6c757d;--border:#dee2e6;--shadow:rgba(0,0,0,.12);--box:#f1f3f5;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--text:#e9ecef;--muted:#9aa1a8;--border:#3a3f45;--shadow:rgba(0,0,0,.5);--box:#2a2e33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.5;padding-bottom:90px}
header{background:#1c1e21;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 8px var(--shadow)}
header a{color:#fff;text-decoration:none;font-size:16px}
header .logo{height:60px;width:auto}
main{padding:20px 16px}
h1{font-weight:400;font-size:32px;margin:0 0 4px}
.sub{color:var(--muted);font-size:17px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:20px;overflow:hidden;box-shadow:0 1px 4px var(--shadow)}
.top{height:150px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:38px;font-weight:600;letter-spacing:1px}
.body{padding:14px 16px 16px}
.name{font-size:20px;margin:0 0 10px}
.go{width:100%;height:46px;border:0;border-radius:8px;background:#2c5aa0;color:#fff;font:inherit;font-size:17px;cursor:pointer}
.panel{display:none;margin-top:14px}
.card.open .panel{display:block}
ol{margin:0 0 12px;padding-inline-start:22px}
li{margin-bottom:6px}
.addr{background:var(--box);border-radius:8px;padding:12px;font-size:16px}
.addr div{margin-bottom:4px}
.copy{margin-top:8px;width:100%;height:42px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.wa{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 4px 10px var(--shadow)}
.wa svg{width:34px;height:34px;fill:#fff}
</style>
</head>
