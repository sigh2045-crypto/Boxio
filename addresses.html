<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZIVOX - العناوين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f6;--fg:#1f2933;--muted:#6b7683;--line:#dfe3e8;--blue:#2b5aa3}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#05070d;border-bottom:1px solid #1b2a4a}
header a{color:#e8edf7;text-decoration:none;font-size:15px}
.logo{line-height:0}
.logo img{height:44px;width:auto;display:block;border-radius:6px}
main{max-width:640px;margin:0 auto;padding:0 16px}
h1{font-size:28px;margin:22px 0 2px}
.sub{color:var(--muted);margin:0 0 18px;font-size:17px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.banner{height:150px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:600;letter-spacing:1px}
.body{padding:16px}
.title{margin:0 0 12px;font-size:20px;font-weight:600}
.how{width:100%;border:0;background:var(--blue);color:#fff;font:inherit;font-size:18px;padding:12px;border-radius:12px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.wa svg{width:34px;height:34px;fill:#fff}

.reg{width:100%;margin-top:10px;border:1px solid var(--blue);background:#fff;color:var(--blue);font:inherit;font-size:18px;padding:11px;border-radius:12px;cursor:pointer}
.hint{margin:0 0 10px;color:var(--muted);font-size:15px}
.me{margin-bottom:20px}
.me .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.me input{border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;font-size:17px;direction:ltr;text-align:right;min-width:0;width:100%}
.me input#mId{grid-column:1/-1}
.mebox{font-size:17px}
.mebox .num{font-size:34px;font-weight:700;letter-spacing:2px;direction:ltr;text-align:right}
.mebox .lbl{color:var(--muted);font-size:15px}
.mebox .rowx{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.mebox a.go{display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;padding:11px;border-radius:12px;margin-top:10px;font-size:18px}
/* النافذة المنبثقة */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.dialog{background:#fff;width:100%;max-width:560px;max-height:92vh;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.dhead{padding:14px 18px 6px;font-size:21px;text-align:center}
.dbody{padding:8px 18px 18px;overflow-y:auto;flex:1}
.info{background:#d1f2fb;color:#055160;border-radius:14px;padding:14px 16px;margin-bottom:18px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.info h3{margin:0 0 6px;font-size:19px;font-weight:600}
.info ol{margin:0 0 10px;padding:0 22px 0 0}
.info li{margin-bottom:2px;font-size:17px}
.note{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px 14px;font-size:17px;margin-top:10px}
.login{background:#fde8e8;color:#9b1c1c;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:16px}
.login a{color:#9b1c1c;font-weight:700}
.sec{font-size:19px;margin:6px 0 10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:18px;margin-bottom:4px}
.warn{color:#d6293e;font-size:16px;margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center}
.row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:18px;background:#fff;color:var(--fg);direction:ltr;text-align:right}
.cp{flex:none;width:46px;height:46px;border:2px solid #6c757d;border-radius:10px;background:#fff;color:#4b5560;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cp svg{width:22px;height:22px;fill:currentColor}
.cp.done{background:#d1f0dc;border-color:#2e9e57;color:#1d7a40}
.help{display:flex;gap:8px;align-items:flex-start}
.dfoot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.visit{background:#145aa8;color:#fff;text-decoration:none;font-size:18px;padding:10px 24px;border-radius:8px}
.close{background:#6c757d;color:#fff;border:0;font:inherit;font-size:18px;padding:10px 24px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
  <a href="index.html">رجوع</a>
  <a href="index.html" class="logo"><img alt="ZIVOX" src="logo.png"></a>
</header>
<main>
  <h1>العناوين</h1>
  <p class="sub">اختر موقعاً عالمياً أدناه لرؤية تعليمات الطلب</p>
  <section class="card me"><div class="body">
    <h2 class="title">حسابك</h2>
    <div id="meBox" class="mebox">جارٍ التحميل...</div>
  </div></section>
  <div id="list"></div>
</main>

<a class="wa" href="https://wa.me/972512006950" target="_blank" rel="noopener noreferrer" aria-label="تواصل عبر واتساب">
  <svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-2c1.8 1 3.8 1.5 5.6 1.5 7 0 12.6-5.600 12.600-12.500C28.600 8.600 23 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.200 1.200-4.300-.3-.4a10 10 0 0 1-1.500-5.300C5.600 10 10.300 5.400 16 5.400S26.400 10 26.400 15.600 21.700 25.800 16 25.800zm5.600-7.500c-.3-.2-1.800-.9-2.100-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100a8.300 8.300 0 0 1-4.100-3.600c-.3-.5.300-.5.900-1.600.1-.2 0-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400s-1 1-1 2.500 1.100 2.900 1.200 3.100 2.100 3.300 5.100 4.500c1.900.8 2.600.9 3.500.7.600-.1 1.800-.7 2-1.400s.2-1.300.2-1.400-.3-.2-.6-.4z"/></svg>
</a>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="dhead" id="dtitle"></div>
    <div class="dbody" id="dbody"></div>
    <div class="dfoot">
      <a class="visit" id="visit" target="_blank" rel="noopener noreferrer">زيارة الموقع</a>
      <button class="close" id="closeBtn" type="button">إغلاق</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyD8-5FFBCE5WHAEai3sPMAdUwAgIg-QaMQ",
  authDomain:"boxio-7bbde.firebaseapp.com",
  projectId:"boxio-7bbde",
  storageBucket:"boxio-7bbde.firebasestorage.app",
  messagingSenderId:"833134820214",
  appId:"1:833134820214:web:37083cab6980150e1e5857"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

/* ===== إعدادات الشحن: غيّرها من هنا وبتتغير عند كل الزبائن ===== */
const SHIP={
  street:"Jaffa St 23",
  country:"Israel",
  region:"Jerusalem",
  city:"Jerusalem",
  zip:"0000211",
  phone:"0525394374"
};
/* ملاحظة صفراء تظهر في أعلى النافذة (مثلاً العمولة). اتركها فارغة لإخفائها. */
const FEE_NOTE="";

/* ===== بيانات الزبون (من حسابه في Firebase) ===== */
let CUSTOMER=null;
function getCustomer(){return CUSTOMER}

const meBox=document.getElementById("meBox");
function showLogin(){
  meBox.innerHTML="";
  const p=document.createElement("div");p.textContent="سجّل دخولك لتظهر معلوماتك ورقم اشتراكك وتتعبّى الحقول تلقائياً.";
  const a=document.createElement("a");a.className="go";a.href="index.html";a.textContent="تسجيل الدخول";
  meBox.append(p,a);
}
function showCustomer(c){
  meBox.innerHTML="";
  const n=document.createElement("div");n.textContent=(c.first+" "+c.last).trim();
  const l=document.createElement("div");l.className="lbl";l.textContent="رقم اشتراكك";
  const r=document.createElement("div");r.className="rowx";
  const num=document.createElement("div");num.className="num";num.textContent=c.id;
  const cp=document.createElement("button");cp.type="button";cp.className="cp";cp.setAttribute("aria-label","نسخ رقم الاشتراك");cp.innerHTML=COPY_ICON;
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(c.id)}catch(e){}
    cp.innerHTML=CHECK_ICON;cp.classList.add("done");setTimeout(()=>{cp.innerHTML=COPY_ICON;cp.classList.remove("done")},1500)};
  r.append(num,cp);meBox.append(n,l,r);
}
function showError(msg){meBox.textContent=msg}

/* يولّد رقم الاشتراك مرة وحدة للزبون من العدّاد، داخل عملية واحدة آمنة */
async function ensureSubscription(uid){
  return runTransaction(db,async tx=>{
    const uRef=doc(db,"users",uid),cRef=doc(db,"counters","subscription");
    const u=await tx.get(uRef);
    if(!u.exists())return null;
    const existing=u.data().subscriptionNumber;
    if(existing!=null)return existing;
    const c=await tx.get(cRef);
    const next=c.data().next;
    tx.update(cRef,{next:next+1});
    tx.update(uRef,{subscriptionNumber:next});
    return next;
  });
}

onAuthStateChanged(auth,async user=>{
  if(!user){CUSTOMER=null;showLogin();return}
  meBox.textContent="جارٍ تحميل بياناتك...";
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    const d=snap.exists()?snap.data():{};
    const id=await ensureSubscription(user.uid);
    if(id==null){showError("ما لقينا ملفك الشخصي. سجّل خروج وادخل من جديد.");return}
    const dn=(user.displayName||"").split(" ");
    CUSTOMER={first:String(d.first||dn[0]||""),last:String(d.last||dn.slice(1).join(" ")||""),id:String(id)};
    showCustomer(CUSTOMER);
  }catch(e){
    console.error(e);
    showError("تعذّر تحميل بياناتك. حدّث الصفحة وجرّب مرة ثانية.");
  }
});

const STORES=[
  {n:"Amazon",ar:"أمازون",bg:"#232f3e",url:"https://www.amazon.com"},
  {n:"TEMU",ar:"تيمو",bg:"#eb7b30",url:"https://www.temu.com"},
  {n:"SHEIN",ar:"شي إن",bg:"#111111",url:"https://www.shein.com"},
  {n:"AliExpress",ar:"علي إكسبرس",bg:"#e43225",url:"https://www.aliexpress.com"},
  {n:"eBay",ar:"إي باي",bg:"#0064d2",url:"https://www.ebay.com"},
  {n:"Etsy",ar:"إتسي",bg:"#f1641e",url:"https://www.etsy.com"},
  {n:"iHerb",ar:"آي هيرب",bg:"#3a8a2e",url:"https://www.iherb.com"},
  {n:"ASOS",ar:"أسوس",bg:"#2d2d2d",url:"https://www.asos.com"},
  {n:"Walmart",ar:"وولمارت",bg:"#0071ce",url:"https://www.walmart.com"},
  {n:"Gymshark",ar:"جيم شارك",bg:"#1a1a1a",url:"https://www.gymshark.com"},
  {n:"Cult Beauty",ar:"كَلت بيوتي",bg:"#c2185b",url:"https://www.cultbeauty.com"},
  {n:"FeelUnique",ar:"فيل يونيك",bg:"#e6007e",url:"https://www.feelunique.com"},
  {n:"NEXT",ar:"نكست",bg:"#222222",url:"https://www.next.co.uk"},
  {n:"Beauty Bay",ar:"بيوتي باي",bg:"#f5a6c6",fg:"#1a1a1a",url:"https://www.beautybay.com"},
  {n:"M&S London",ar:"إم آند إس لندن",bg:"#0b0b0b",url:"https://www.marksandspencer.com"},
  {n:"Alo",ar:"ألو يوغا",bg:"#6b6b6b",url:"https://www.aloyoga.com"},
  {n:"MyProtein",ar:"ماي بروتين",bg:"#0a3d91",url:"https://www.myprotein.com"},
  {n:"Cider",ar:"سايدر",bg:"#e8b4a0",fg:"#1a1a1a",url:"https://www.shopcider.com"},
  {n:"Victoria's Secret",ar:"فيكتوريا سيكريت",bg:"#e91e8c",url:"https://www.victoriassecret.com"}
];

const COPY_ICON='<svg viewBox="0 0 24 24"><path d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H10V7h9v14z"/></svg>';
const CHECK_ICON='<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.400 1.400L9 19 21 7l-1.400-1.400z"/></svg>';

const list=document.getElementById("list");
STORES.forEach((s,i)=>{
  const card=document.createElement("div");card.className="card";
  const b=document.createElement("div");b.className="banner";b.textContent=s.n;b.style.background=s.bg;b.style.color=s.fg||"#fff";
  const body=document.createElement("div");body.className="body";
  const t=document.createElement("h2");t.className="title";t.textContent=s.ar+" | "+s.n;
  const btn=document.createElement("button");btn.className="how";btn.type="button";btn.textContent="كيفية الطلب";
  btn.onclick=()=>openDialog(s,btn);
  const reg=document.createElement("button");reg.className="reg";reg.type="button";reg.textContent="التسجيل في "+s.n;
  reg.onclick=()=>openReg(s,reg);
  body.append(t,btn,reg);card.append(b,body);list.appendChild(card);
});

const overlay=document.getElementById("overlay"),dbody=document.getElementById("dbody"),
      dtitle=document.getElementById("dtitle"),visit=document.getElementById("visit"),
      closeBtn=document.getElementById("closeBtn");
let lastBtn=null;

function field(label,value,warn){
  const f=document.createElement("div");f.className="field";
  const l=document.createElement("label");l.textContent=label;f.appendChild(l);
  if(warn){const w=document.createElement("p");w.className="warn";w.textContent=warn;f.appendChild(w)}
  const r=document.createElement("div");r.className="row";
  const inp=document.createElement("input");inp.type="text";inp.readOnly=true;inp.value=value;inp.setAttribute("aria-label",label);
  const cp=document.createElement("button");cp.type="button";cp.className="cp";cp.setAttribute("aria-label","نسخ "+label);cp.innerHTML=COPY_ICON;
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(value)}catch(e){inp.select();try{document.execCommand("copy")}catch(_){}}
    cp.innerHTML=CHECK_ICON;cp.classList.add("done");
    setTimeout(()=>{cp.innerHTML=COPY_ICON;cp.classList.remove("done")},1500);
  };
  r.append(inp,cp);f.appendChild(r);return f;
}

function openDialog(s,btn){
  lastBtn=btn;
  const c=getCustomer();
  const fullName=c?(c.first+" "+c.id+(c.last?" "+c.last:"")):"";
  dtitle.textContent=s.ar+" | "+s.n+" - كيفية الطلب";
  dbody.innerHTML="";

  const info=document.createElement("div");info.className="info";
  const steps=[
    "انسخ معلوماتك من الحقول أدناه",
    "قم بزيارة الموقع الذي تريد الطلب منه",
    "املأ معلوماتك في نموذج الطلب الخاص بهم",
    "أكمل عملية الطلب وتتبع طردك"
  ];
  info.innerHTML='<h3>تعليمات الطلب</h3><ol>'+steps.map(x=>'<li>'+x+'</li>').join("")+'</ol>';
  const extra=[];
  extra.push("إذا طلب الموقع رقم هوية، اكتب رقم هويتك الشخصية.");
  extra.forEach(x=>{const n=document.createElement("div");n.className="note";n.textContent=x;info.appendChild(n)});
  if(FEE_NOTE){const n=document.createElement("div");n.className="note";n.textContent=FEE_NOTE;info.appendChild(n)}
  dbody.appendChild(info);

  if(!c){
    const lg=document.createElement("div");lg.className="login";
    lg.innerHTML='سجّل دخولك لتتعبّى معلوماتك تلقائياً. <a href="index.html">تسجيل الدخول</a>';
    dbody.appendChild(lg);
  }

  const sec=document.createElement("div");sec.className="sec";sec.textContent="معلوماتك";dbody.appendChild(sec);
  dbody.appendChild(field("اسمك الأول، (رقم اشتراكك)، اسم العائلة",fullName,"الرجاء كتابة رقم اشتراكك."));
  dbody.appendChild(field("رقم اشتراكك",c?c.id:""));
  dbody.appendChild(field("العنوان",SHIP.street));
  dbody.appendChild(field("البلد / المنطقة",SHIP.country));
  dbody.appendChild(field("المنطقة",SHIP.region));
  dbody.appendChild(field("رقم الهاتف",SHIP.phone,"الرجاء استخدام رقم الهاتف هذا، وليس رقمك الشخصي."));
  dbody.appendChild(field("المدينة",SHIP.city));
  dbody.appendChild(field("الرمز البريدي",SHIP.zip));

  const help=document.createElement("div");help.className="note";
  help.innerHTML='إذا كنت بحاجة إلى أي مساعدة، يرجى التواصل مع فريق الدعم لدينا عبر <a href="https://wa.me/972512006950" target="_blank" rel="noopener noreferrer">واتساب</a>.';
  dbody.appendChild(help);

  visit.href=s.url;
  overlay.classList.add("open");document.body.classList.add("lock");
  dbody.scrollTop=0;closeBtn.focus();
}
function openReg(s,btn){
  lastBtn=btn;
  dtitle.textContent=s.ar+" | "+s.n+" - التسجيل";
  dbody.innerHTML="";
  const info=document.createElement("div");info.className="info";
  const steps=[
    "اضغط «زيارة الموقع» لفتح موقع "+s.n,
    "اضغط على إنشاء حساب (Sign up / Create account)",
    "سجّل بإيميلك وكلمة مرور، وفعّل الحساب من رسالة التأكيد",
    "ارجع هنا واضغط «كيفية الطلب» لنسخ معلوماتك"
  ];
  info.innerHTML='<h3>خطوات التسجيل</h3><ol>'+steps.map(x=>'<li>'+x+'</li>').join("")+'</ol>';
  dbody.appendChild(info);
  const help=document.createElement("div");help.className="note";
  help.innerHTML='إذا واجهتك مشكلة في التسجيل، تواصل معنا عبر <a href="https://wa.me/972512006950" target="_blank" rel="noopener noreferrer">واتساب</a>.';
  dbody.appendChild(help);
  visit.href=s.url;
  overlay.classList.add("open");document.body.classList.add("lock");
  dbody.scrollTop=0;closeBtn.focus();
}
function closeDialog(){
  overlay.classList.remove("open");document.body.classList.remove("lock");
  if(lastBtn)lastBtn.focus();
}
closeBtn.onclick=closeDialog;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeDialog()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open"))closeDialog()});
</script>
</body>
</html>
