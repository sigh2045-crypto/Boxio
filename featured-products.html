<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxio - منتجات مُختارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f6;--card:#fff;--soft:#ececee;--text:#1b1c1f;--muted:#6b6e76;--line:#dcdde1;--dark:#1b1c1f;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--card:#1d1f24;--soft:#272a31;--text:#f1f1f3;--muted:#9a9ea8;--line:#2e3139}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.5}
header{background:#1b1c1f;color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;direction:ltr;font:700 1.5rem 'Montserrat','Cairo',Arial,sans-serif;letter-spacing:.04em;color:#fff;text-decoration:none}
.logo svg{width:28px;height:28px}
.back{color:#fff;text-decoration:none;border:1px solid #55585f;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.95rem}
.back:focus-visible,.chip:focus-visible,.shop:focus-visible{outline:3px solid #fff;outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:1.4rem;margin:4px 4px 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 8px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 14px;font:600 .9rem 'Cairo',sans-serif;cursor:pointer}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.img{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:3.4rem;background:var(--soft)}
.img img{width:100%;height:100%;object-fit:contain}
.info{padding:10px;display:flex;flex-direction:column;flex:1}
.info h3{margin:0 0 4px;font-size:.95rem;line-height:1.35}
.cat{color:var(--muted);font-size:.8rem;margin-bottom:8px}
.shops{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.shop{display:block;text-align:center;border:1.5px solid var(--text);border-radius:999px;padding:5px 6px;color:var(--text);text-decoration:none;font-weight:600;font-size:.85rem}
.shop:hover{background:var(--dark);color:#fff}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">رجوع</a>
  <a class="logo" href="index.html" aria-label="Boxio">
    <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M16 3 4 9v14l12 6 12-6V9L16 3Z"/><path d="M4 9l12 6 12-6M16 15v14"/></svg>
    BOXIO
  </a>
</header>
<div class="wrap">
  <h1>منتجات مُختارة</h1>
  <div class="chips" id="chips"></div>
  <div class="grid" id="list"></div>
</div>
<script>
// عدّل المنتجات هون: ضع رابط الصورة في image، وروابط المتاجر في links
var PRODUCTS=[
 {name:"برايمر هيدراتينغ من SHEGLAM",cat:"الجمال والعناية",icon:"💄",image:"",links:{shein:"https://www.shein.com"}},
 {name:"مقبض تصوير مع بلوتوث و اضاءة",cat:"ادوات التصوير بالهاتف",icon:"📱",image:"",links:{ali:"https://www.aliexpress.com",shein:"https://www.shein.com",temu:"https://www.temu.com"}}
];
var STORES={shein:"تسوّق من شي ان",ali:"تسوّق من علي اكسبرس",temu:"تسوّق من تيمو"};
var list=document.getElementById('list'),chips=document.getElementById('chips'),cur='الكل';
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
  var cats=['الكل'].concat(PRODUCTS.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
  chips.innerHTML=cats.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
  list.innerHTML=PRODUCTS.filter(function(p){return cur==='الكل'||p.cat===cur}).map(function(p){
    var im=p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':p.icon;
    var ls=Object.keys(p.links).map(function(k){return '<a class="shop" target="_blank" rel="noopener" href="'+esc(p.links[k])+'">'+STORES[k]+'</a>'}).join('');
    return '<article class="card"><div class="img">'+im+'</div><div class="info"><h3>'+esc(p.name)+'</h3><div class="cat">'+esc(p.cat)+'</div><div class="shops">'+ls+'</div></div></article>';
  }).join('');
}
chips.addEventListener('click',function(e){var c=e.target.getAttribute('data-c');if(c){cur=c;render()}});
render();
</script>
</body>
</html>
