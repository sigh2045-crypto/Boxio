<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boxio - منتجات مُختارة</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e5e5e5;--card:#f6f6f4;--accent:#1a1a1a;--accent-fg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#a0a0a0;--line:#2e2e2e;--card:#1e1e1e;--accent:#f2f2f2;--accent-fg:#141414;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--fg);text-decoration:none}
.logo{font-weight:800;letter-spacing:2px}
h1{font-size:26px;margin:22px 16px 6px}
.sub{margin:0 16px 14px;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:none;color:var(--fg);padding:7px 14px;border-radius:20px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 16px 32px;max-width:980px;margin:0 auto}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:700;font-size:15px}
.store{font-size:12px;color:var(--muted)}
.btn{margin-top:auto;text-align:center;background:var(--accent);color:var(--accent-fg);text-decoration:none;padding:8px;border-radius:10px;font-size:14px;font-weight:600}
.btn:focus-visible,.tabs button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
</style>
</head>
<body>
<header>
  <a href="index.html">رجوع</a>
  <a href="index.html" class="logo">BOXIO</a>
</header>
<h1>منتجات مُختارة</h1>
<p class="sub">ترندات مأخوذة من مقالات وتقارير 2026. الروابط تفتح نتائج البحث في المتجر.</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<script>
/* لإضافة صورة لأي منتج: ضع رابط الصورة في الحقل img، وإلا يظهر الرمز. */
const S={
  ali:q=>["AliExpress","https://www.aliexpress.com/wholesale?SearchText="+encodeURIComponent(q)],
  shein:q=>["SHEIN","https://www.shein.com/pdsearch/"+encodeURIComponent(q)+"/"],
  amz:q=>["Amazon","https://www.amazon.com/s?k="+encodeURIComponent(q)]
};
const P=[
  {n:"قلادة بالاسم",e:"📿",q:"custom name necklace",s:"ali",c:"AliExpress",img:""},
  {n:"خدّاشة قطط",e:"🐱",q:"cat scratching pad",s:"ali",c:"AliExpress",img:""},
  {n:"بطانية كهربائية",e:"🛏️",q:"electric heated blanket",s:"ali",c:"AliExpress",img:""},
  {n:"علبة غداء كهربائية",e:"🍱",q:"electric lunch box",s:"ali",c:"AliExpress",img:""},
  {n:"ممسحة صغيرة",e:"🧹",q:"mini mop",s:"ali",c:"AliExpress",img:""},
  {n:"سرير حيوانات أليفة",e:"🐶",q:"cute pet bed",s:"ali",c:"AliExpress",img:""},
  {n:"خاتم بأجنحة",e:"💍",q:"angel wing ring",s:"ali",c:"AliExpress",img:""},
  {n:"ملابس خريفية نسائية",e:"🍂",q:"fall women clothing",s:"shein",c:"SHEIN",img:""},
  {n:"كورسيه دانتيل (Dark Romance)",e:"🖤",q:"dark romance lace corset",s:"shein",c:"SHEIN",img:""},
  {n:"تنورة طويلة",e:"👗",q:"long skirt",s:"shein",c:"SHEIN",img:""},
  {n:"ملابس شتوية",e:"🧥",q:"winter coat women",s:"shein",c:"SHEIN",img:""},
  {n:"زينة هالوين",e:"🎃",q:"halloween decorations",s:"amz",c:"Amazon",img:""},
  {n:"بطانية كهربائية",e:"🔥",q:"electric blanket",s:"amz",c:"Amazon",img:""},
  {n:"علبة غداء محمولة",e:"🥡",q:"portable electric lunch box",s:"amz",c:"Amazon",img:""},
  {n:"هدايا وأدوات عناية",e:"🎁",q:"self care gift set",s:"amz",c:"Amazon",img:""}
];
const cats=["الكل","AliExpress","SHEIN","Amazon"];
let cur="الكل";
const tabs=document.getElementById("tabs"),grid=document.getElementById("grid");
function render(){
  tabs.innerHTML="";
  cats.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.setAttribute("aria-pressed",c===cur);b.onclick=()=>{cur=c;render()};tabs.appendChild(b)});
  grid.innerHTML="";
  P.filter(p=>cur==="الكل"||p.c===cur).forEach(p=>{
    const [store,url]=S[p.s](p.q);
    const card=document.createElement("div");card.className="card";
    const pic=document.createElement("div");pic.className="pic";
    if(p.img){const i=document.createElement("img");i.src=p.img;i.alt=p.n;i.loading="lazy";pic.appendChild(i)}else{pic.textContent=p.e;pic.setAttribute("aria-hidden","true")}
    const info=document.createElement("div");info.className="info";
    const n=document.createElement("div");n.className="name";n.textContent=p.n;
    const st=document.createElement("div");st.className="store";st.textContent=store;
    const a=document.createElement("a");a.className="btn";a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="شاهد المنتج";
    info.append(n,st,a);card.append(pic,info);grid.appendChild(card);
  });
}
render();
</script>
</body>
</html>
