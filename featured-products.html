<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZIVOX - منتجات مُختارة</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--line:#e8e8e8;--card:#fff;--accent:#1a1a1a;--accent-fg:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#a0a0a0;--line:#2e2e2e;--card:#1e1e1e;--accent:#f2f2f2;--accent-fg:#141414;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding-bottom:90px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#05070d;border-bottom:1px solid #1b2a4a}
header a{color:#e8edf7;text-decoration:none}
.logo{display:flex;align-items:center}
.logo img{height:44px;width:auto;display:block;border-radius:6px}
h1{font-size:26px;margin:22px 16px 6px}
.sub{margin:0 16px 14px;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;padding:0 16px 14px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:none;color:var(--fg);padding:7px 14px;border-radius:20px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 16px 32px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1/1}
.pic svg,.pic img{width:100%;height:100%;display:block;object-fit:cover}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:700;font-size:15px}
.store{font-size:12px;color:var(--muted);margin-bottom:6px}
.btn{margin-top:auto;text-align:center;background:var(--accent);color:var(--accent-fg);text-decoration:none;padding:8px;border-radius:10px;font-size:14px;font-weight:600}
.btn:focus-visible,.tabs button:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.search{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-size:15px}
.tabs{padding-bottom:10px}
section{max-width:980px;margin:0 auto 10px}
.sec-h{display:flex;align-items:center;gap:8px;margin:6px 16px 10px;font-size:18px;font-weight:800}
.sec-h i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sec-h small{color:var(--muted);font-weight:400;font-size:13px}
.sec-h button{margin-inline-start:auto;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.grid{padding-bottom:18px}
a.card{text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
a.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
a.card:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.pic{display:grid;place-items:center;font-size:54px;background:color-mix(in srgb,var(--c) 16%,var(--card))}
.store::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:6px}
.btn{display:block}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.wa{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5}
.wa svg{width:34px;height:34px;fill:#fff}
</style>
</head>
