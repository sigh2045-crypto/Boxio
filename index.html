<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOXIO</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--muted:#5c6780;--line:#d5dbe7;--accent:#f5b301;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#f1f4fb;--muted:#9aa6c2;--line:#2b3654;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{max-width:440px;margin:0 auto;padding:22px 4px 14px;font-weight:800;font-size:26px;letter-spacing:3px}
main{max-width:440px;margin:0 auto 32px;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tabs button{padding:15px 8px;border:0;background:transparent;color:var(--muted);font:500 16px Tajawal,sans-serif;cursor:pointer;border-bottom:3px solid var(--line)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
form{padding:20px 18px 24px}
label{display:block;margin:14px 0 6px;font-size:15px;font-weight:500}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:400 16px Tajawal,sans-serif}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.remember{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:15px;cursor:pointer}
.remember input{width:22px;height:22px;padding:0;accent-color:var(--accent)}
.link{display:block;width:100%;margin-top:14px;background:none;border:0;color:var(--muted);font:500 14px Tajawal,sans-serif;text-decoration:underline;cursor:pointer}
.showpw{margin:10px 0 0;font-size:14px;color:var(--muted)}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--err)}
.msg.ok{color:var(--ink)}
.go{width:100%;margin-top:8px;padding:14px;border:0;border-radius:8px;background:var(--accent);color:#14213d;font:800 17px Tajawal,sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
.wa{display:block;text-align:center;margin:0 0 22px;color:var(--muted);font-size:14px}
body.home{padding:0;background:#1e0a58}
#home{min-height:100vh;color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#1f2125}
.user{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:#14213d;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.avatar::after{content:"";position:absolute;bottom:-1px;inset-inline-end:-1px;width:12px;height:12px;border-radius:50%;background:#2e9d57;border:2px solid #1f2125}
.mail{font-size:13px;color:#c9ccd3;direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
#out{flex:none;padding:8px 14px;border:1px solid #4a4e57;border-radius:8px;background:transparent;color:#fff;font:500 14px Tajawal,system-ui,sans-serif;cursor:pointer}
.hero{background:linear-gradient(160deg,#2a2c31,#17181b);text-align:center;padding:48px 16px 56px}
.hero svg{width:84px;height:84px}
.hero h1{margin:14px 0 6px;font-size:68px;font-weight:800;letter-spacing:2px;font-family:Montserrat,Tajawal,system-ui,sans-serif}
.hero p{margin:0;font-size:22px;font-weight:400;font-family:Montserrat,Tajawal,system-ui,sans-serif;color:#e6e7ea}
.menu{padding:30px 16px 40px;display:flex;flex-direction:column;gap:22px;max-width:520px;margin:0 auto}
.menu a{display:block;padding:20px 12px;background:#fff;color:#1e0a58;text-align:center;text-decoration:none;font-size:18px;border-radius:4px}
[hidden]{display:none}
</style>
</head>
<body>
<div id="loginView">
<header>BOXIO</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-login" aria-selected="true">مسجل من قبل</button>
    <button role="tab" id="t-signup" aria-selected="false">مستخدم جديد</button>
  </div>

  <form id="login" novalidate>
    <label for="l-email">البريد الإلكتروني</label>
    <input class="ltr" id="l-email" type="email" autocomplete="email" required>
    <label for="l-pass">الرقم السري</label>
    <input class="ltr" id="l-pass" type="password" autocomplete="current-password" required>
    <label class="remember showpw"><input type="checkbox" data-show="l-pass"> إظهار الرقم السري</label>
    <label class="remember"><input type="checkbox" id="l-remember"> تذكرني</label>
    <div class="msg" id="l-msg" role="alert"></div>
    <button class="go" type="submit">تسجيل الدخول</button>
    <button class="link" type="button" id="l-forgot">نسيت الرقم السري؟</button>
  </form>

  <form id="signup" novalidate hidden>
    <label for="s-email">البريد الإلكتروني</label>
    <input class="ltr" id="s-email" type="email" autocomplete="email" required>
    <label for="s-first">الاسم الأول (بالإنجليزي)</label>
    <input class="ltr" id="s-first" autocomplete="given-name" required>
    <label for="s-last">اسم العائلة (بالإنجليزي)</label>
    <input class="ltr" id="s-last" autocomplete="family-name" required>
    <label for="s-phone">رقم الهاتف</label>
    <input class="ltr" id="s-phone" type="tel" autocomplete="tel" required>
    <label for="s-city">المدينة</label>
    <input id="s-city" autocomplete="address-level2" required>
    <label for="s-village">القرية (اختياري)</label>
    <input id="s-village">
    <label for="s-addr">تفاصيل تساعد بالوصول للعنوان</label>
    <textarea id="s-addr" rows="2" required placeholder="مثلاً: بجانب سوبر ماركت ... أو بالقرب من ..."></textarea>
    <label for="s-pass">الرقم السري</label>
    <input class="ltr" id="s-pass" type="password" autocomplete="new-password" minlength="8" required>
    <label for="s-pass2">تأكيد الرقم السري</label>
    <input class="ltr" id="s-pass2" type="password" autocomplete="new-password" required>
    <label class="remember showpw"><input type="checkbox" data-show="s-pass,s-pass2"> إظهار الرقم السري</label>
    <label for="s-ref">كود الإحالة (اختياري)</label>
    <input class="ltr" id="s-ref">
    <div class="msg" id="s-msg" role="alert"></div>
    <button class="go" type="submit">إنشاء حساب</button>
  </form>

  <a class="wa" href="https://wa.me/972512006950">تواصل معنا عبر واتساب</a>
</main>
</div>

<div id="home" hidden>
  <div class="top">
    <div class="user"><div class="avatar" id="av"></div><span class="mail" id="mail"></span></div>
    <button id="out" type="button">تسجيل خروج</button>
  </div>
  <section class="hero">
    <svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" aria-hidden="true">
      <path d="M60 8 104 32V82L60 108 16 82V32Z"/><path d="M16 32 60 56 104 32"/><path d="M60 56V108"/><path d="M38 20 82 44V58"/>
    </svg>
    <h1>BOXIO</h1>
    <p>Your shipping address</p>
  </section>
  <nav class="menu">
    <a href="https://sigh2045-crypto.github.io/Boxio/featured-products.html">منتجات مختارة</a>
    <a href="https://sigh2045-crypto.github.io/Boxio/addresses.html">العناوين</a>
    <a href="https://m.shein.com/us/?ref=us&rep=dir&ret=mus">اضغط هنا لتفعيل خصم شي ان</a>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, setPersistence,
         browserLocalPersistence, browserSessionPersistence, onAuthStateChanged, sendPasswordResetEmail, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8-5FFBCE5WHAEai3sPMAdUwAgIg-QaMQ",
  authDomain: "boxio-7bbde.firebaseapp.com",
  projectId: "boxio-7bbde",
  storageBucket: "boxio-7bbde.firebasestorage.app",
  messagingSenderId: "833134820214",
  appId: "1:833134820214:web:37083cab6980150e1e5857"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);


// رابط Google Sheets (Apps Script) - كل تسجيل جديد بينبعت للجدول كمان
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxUsKb8FgOMydaTZFUjccJjiKMaLNx11clVC8QzYtb0q8-eN2hQ-NeR6zSxPZWqpMAxZA/exec";

function sendToSheet(d){
  if (!SHEET_URL) return;
  try {
    fetch(SHEET_URL, {
      method: "POST", mode: "no-cors", keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ email:d.email, first:d.first, last:d.last, phone:d.phone,
                             city:d.city, village:d.village, address:d.address, ref:d.ref })
    }).catch(() => {});
  } catch(e) { console.error(e); }
}

const $ = id => document.getElementById(id);
let busy = false;

function show(tab){
  const login = tab === "login";
  $("login").hidden = !login; $("signup").hidden = login;
  $("t-login").setAttribute("aria-selected", login);
  $("t-signup").setAttribute("aria-selected", !login);
}
$("t-login").onclick = () => show("login");
$("t-signup").onclick = () => show("signup");

// إظهار / إخفاء الرقم السري
document.querySelectorAll("[data-show]").forEach(cb => {
  cb.addEventListener("change", () => {
    cb.dataset.show.split(",").forEach(id => { $(id).type = cb.checked ? "text" : "password"; });
  });
});

// تعبئة الإيميل تلقائياً إذا المستخدم اختار "تذكرني" سابقاً
try {
  const saved = localStorage.getItem("boxio_email");
  if (saved) { $("l-email").value = saved; $("l-remember").checked = true; }
} catch(e) {}

// عرض صفحة الدخول أو الصفحة الرئيسية حسب حالة المستخدم
function render(user){
  const on = !!user;
  $("loginView").hidden = on;
  $("home").hidden = !on;
  document.body.classList.toggle("home", on);
  if (on) {
    $("av").textContent = (user.email || "?").trim().charAt(0);
    $("mail").textContent = user.email;
  }
}
onAuthStateChanged(auth, user => { if (!busy) render(user); });
$("out").onclick = () => signOut(auth);

const ERRORS = {
  "auth/invalid-credential": "الإيميل أو الرقم السري غير صحيح",
  "auth/user-not-found": "الإيميل أو الرقم السري غير صحيح",
  "auth/wrong-password": "الإيميل أو الرقم السري غير صحيح",
  "auth/invalid-email": "صيغة الإيميل غير صحيحة",
  "auth/email-already-in-use": "هذا الإيميل مسجل من قبل، جرّب تسجيل الدخول",
  "auth/weak-password": "الرقم السري ضعيف، استخدم 8 خانات على الأقل",
  "auth/too-many-requests": "محاولات كثيرة، انتظر شوي وجرّب مرة ثانية",
  "auth/network-request-failed": "في مشكلة بالاتصال بالإنترنت"
};
const friendly = e => ERRORS[e.code] || (e.code ? "صار خطأ، جرّب مرة ثانية" : e.message);

async function doLogin(email, password, remember){
  await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
  await signInWithEmailAndPassword(auth, email, password);
}

async function doSignup(d){
  await setPersistence(auth, browserLocalPersistence);
  const cred = await createUserWithEmailAndPassword(auth, d.email, d.password);
  sendToSheet(d);
  try {
    await setDoc(doc(db, "users", cred.user.uid), {
      email: d.email, first: d.first, last: d.last, phone: d.phone,
      city: d.city, village: d.village, address: d.address, ref: d.ref, createdAt: serverTimestamp()
    });
  } catch(e) {
    console.error(e);
    throw new Error("تم إنشاء حسابك لكن تعذّر حفظ بياناتك. سجّل دخول وجرّب مرة ثانية");
  }
}

async function run(form, msgEl, fn){
  const btn = form.querySelector(".go");
  btn.disabled = true; busy = true; msgEl.className = "msg"; msgEl.textContent = "";
  try { await fn(); busy = false; render(auth.currentUser); }
  catch(e){ msgEl.textContent = friendly(e); busy = false; }
  finally { btn.disabled = false; }
}

$("login").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("l-email").value.trim(), pass = $("l-pass").value;
  if(!email || !pass){ $("l-msg").textContent = "أدخل البريد والرقم السري"; return; }
  const remember = $("l-remember").checked;
  try {
    if (remember) localStorage.setItem("boxio_email", email);
    else localStorage.removeItem("boxio_email");
  } catch(e) {}
  run($("login"), $("l-msg"), () => doLogin(email, pass, remember));
});

$("l-forgot").addEventListener("click", async () => {
  const m = $("l-msg"), email = $("l-email").value.trim();
  m.className = "msg";
  if(!email){ m.textContent = "اكتب إيميلك أولاً وبعدين اضغط نسيت الرقم السري"; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    m.className = "msg ok";
    m.textContent = "إذا الإيميل مسجل عندنا، رح يوصلك رابط لتعيين رقم سري جديد";
  } catch(e){ m.textContent = friendly(e); }
});

$("signup").addEventListener("submit", e => {
  e.preventDefault();
  const m = $("s-msg"), p = $("s-pass").value;
  const need = ["s-email","s-first","s-last","s-phone","s-city","s-addr"].some(id => !$(id).value.trim());
  if(need){ m.textContent = "عبّي كل الخانات المطلوبة"; return; }
  if(p.length < 8){ m.textContent = "الرقم السري لازم يكون 8 خانات على الأقل"; return; }
  if(p !== $("s-pass2").value){ m.textContent = "الرقم السري وتأكيده غير متطابقين"; return; }
  run($("signup"), m, () => doSignup({
    email:$("s-email").value.trim(), first:$("s-first").value.trim(),
    last:$("s-last").value.trim(), phone:$("s-phone").value.trim(),
    city:$("s-city").value.trim(), village:$("s-village").value.trim(),
    address:$("s-addr").value.trim(), ref:$("s-ref").value.trim(), password:p
  }));
});
</script>
</body>
</html>
