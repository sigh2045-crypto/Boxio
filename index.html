<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOXIO</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--muted:#5c6780;--line:#d5dbe7;--accent:#f5b301;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#f1f4fb;--muted:#9aa6c2;--line:#2b3654;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{max-width:440px;margin:0 auto;padding:22px 4px 14px;font-weight:800;font-size:26px;letter-spacing:3px}
main{max-width:440px;margin:0 auto 32px;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tabs button{padding:15px 8px;border:0;background:transparent;color:var(--muted);font:500 16px Tajawal,sans-serif;cursor:pointer;border-bottom:3px solid var(--line)}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
form{padding:20px 18px 24px}
label{display:block;margin:14px 0 6px;font-size:15px;font-weight:500}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:400 16px Tajawal,sans-serif}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--err)}
.msg.ok{color:var(--ink)}
.go{width:100%;margin-top:8px;padding:14px;border:0;border-radius:8px;background:var(--accent);color:#14213d;font:800 17px Tajawal,sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
.wa{display:block;text-align:center;margin:0 0 22px;color:var(--muted);font-size:14px}
[hidden]{display:none}
</style>
</head>
<body>
<header>BOXIO</header>
<main>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-login" aria-selected="true">مسجل من قبل</button>
    <button role="tab" id="t-signup" aria-selected="false">مستخدم جديد</button>
  </div>

  <form id="login" novalidate>
    <label for="l-email">البريد الإلكتروني</label>
    <input class="ltr" id="l-email" type="email" autocomplete="email" required>
    <label for="l-pass">الرقم السري</label>
    <input class="ltr" id="l-pass" type="password" autocomplete="current-password" required>
    <div class="msg" id="l-msg" role="alert"></div>
    <button class="go" type="submit">تسجيل الدخول</button>
  </form>

  <form id="signup" novalidate hidden>
    <label for="s-email">البريد الإلكتروني</label>
    <input class="ltr" id="s-email" type="email" autocomplete="email" required>
    <label for="s-first">الاسم الأول (بالإنجليزي)</label>
    <input class="ltr" id="s-first" autocomplete="given-name" required>
    <label for="s-last">اسم العائلة (بالإنجليزي)</label>
    <input class="ltr" id="s-last" autocomplete="family-name" required>
    <label for="s-phone">رقم الهاتف</label>
    <input class="ltr" id="s-phone" type="tel" autocomplete="tel" required>
    <label for="s-addr">تفاصيل تساعد بالوصول للعنوان</label>
    <textarea id="s-addr" rows="2" required placeholder="مثلاً: بجانب سوبر ماركت ... أو بالقرب من ..."></textarea>
    <label for="s-pass">الرقم السري</label>
    <input class="ltr" id="s-pass" type="password" autocomplete="new-password" minlength="8" required>
    <label for="s-pass2">تأكيد الرقم السري</label>
    <input class="ltr" id="s-pass2" type="password" autocomplete="new-password" required>
    <label for="s-ref">كود الإحالة (اختياري)</label>
    <input class="ltr" id="s-ref">
    <div class="msg" id="s-msg" role="alert"></div>
    <button class="go" type="submit">إنشاء حساب</button>
  </form>

  <a class="wa" href="https://wa.me/972512006950">تواصل معنا عبر واتساب</a>
</main>

<script>
const APP_URL = "app.html"; // ← رابط التطبيق بعد الدخول

const $ = id => document.getElementById(id);
function show(tab){
  const login = tab === "login";
  $("login").hidden = !login; $("signup").hidden = login;
  $("t-login").setAttribute("aria-selected", login);
  $("t-signup").setAttribute("aria-selected", !login);
}
$("t-login").onclick = () => show("login");
$("t-signup").onclick = () => show("signup");

/* ===== الربط مع نظام الحسابات =====
   لازم هاي الدوال تتصل بخدمة حقيقية (Firebase Auth أو Supabase).
   لا تخزّن الرقم السري في Google Sheets أو localStorage. */
async function doLogin(email, password){
  throw new Error("لم يتم ربط تسجيل الدخول بعد");
}
async function doSignup(data){
  throw new Error("لم يتم ربط إنشاء الحساب بعد");
}

async function run(form, msgEl, fn){
  const btn = form.querySelector(".go");
  btn.disabled = true; msgEl.className = "msg"; msgEl.textContent = "";
  try { await fn(); location.href = APP_URL; }
  catch(e){ msgEl.textContent = e.message; }
  finally { btn.disabled = false; }
}

$("login").addEventListener("submit", e => {
  e.preventDefault();
  const email = $("l-email").value.trim(), pass = $("l-pass").value;
  if(!email || !pass){ $("l-msg").textContent = "أدخل البريد والرقم السري"; return; }
  run($("login"), $("l-msg"), () => doLogin(email, pass));
});

$("signup").addEventListener("submit", e => {
  e.preventDefault();
  const m = $("s-msg"), p = $("s-pass").value;
  const need = ["s-email","s-first","s-last","s-phone","s-addr"].some(id => !$(id).value.trim());
  if(need){ m.textContent = "عبّي كل الخانات المطلوبة"; return; }
  if(p.length < 8){ m.textContent = "الرقم السري لازم يكون 8 خانات على الأقل"; return; }
  if(p !== $("s-pass2").value){ m.textContent = "الرقم السري وتأكيده غير متطابقين"; return; }
  run($("signup"), m, () => doSignup({
    email:$("s-email").value.trim(), first:$("s-first").value.trim(),
    last:$("s-last").value.trim(), phone:$("s-phone").value.trim(),
    address:$("s-addr").value.trim(), ref:$("s-ref").value.trim(), password:p
  }));
});
</script>
</body>
</html>
