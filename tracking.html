<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تتبّع طلبك | ZIVOX</title>
<style>
  :root{
    --bg:#f6f7f4; --card:#ffffff; --text:#1c2321; --muted:#66706b;
    --line:#d9ded9; --accent:#1f6f5c; --accent-text:#ffffff; --err:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121715; --card:#1b2220; --text:#eef2ef; --muted:#9aa6a0;
      --line:#2f3a36; --accent:#4cc3a3; --accent-text:#0c1512; --err:#ff8a80;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 16px; padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  }
  .card{
    width:100%; max-width:440px; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:28px 22px;
  }
  h1{font-size:1.5rem; margin:0 0 8px}
  p{margin:0 0 20px; color:var(--muted); line-height:1.7}
  label{display:block; font-weight:600; margin-bottom:8px}
  input{
    width:100%; padding:14px; font-size:1rem; font-family:inherit;
    color:var(--text); background:var(--bg);
    border:1px solid var(--line); border-radius:10px;
    direction:ltr; text-align:left;
  }
  input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  .row{display:flex; gap:8px}
  .row input{flex:1}
  .paste{
    padding:0 14px; border:1px solid var(--line); background:transparent;
    color:var(--text); border-radius:10px; font-family:inherit; font-size:.95rem; cursor:pointer;
  }
  .go{
    margin-top:14px; width:100%; padding:14px; font-size:1.05rem; font-weight:700;
    font-family:inherit; border:0; border-radius:10px; cursor:pointer;
    background:var(--accent); color:var(--accent-text);
  }
  .msg{min-height:1.4em; margin:12px 0 0; font-size:.92rem; color:var(--err)}
  .back{display:inline-block; margin-top:18px; color:var(--muted); text-decoration:none; font-size:.95rem}
  .back:hover{color:var(--text)}
</style>
</head>
<body>
  <main class="card">
    <h1>تتبّع طلبك</h1>
    <p>حط رابط التتبع اللي وصلك بعد الشراء (أو رقم الشحنة) وانضغط على تتبّع.</p>

    <label for="track">رابط التتبع أو رقم الشحنة</label>
    <div class="row">
      <input id="track" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://...">
      <button class="paste" id="pasteBtn" type="button">لصق</button>
    </div>

    <button class="go" id="goBtn" type="button">تتبّع طردي</button>
    <p class="msg" id="msg" role="alert"></p>

    <a class="back" href="index.html">رجوع للصفحة الرئيسية</a>
  </main>

<script>
(function(){
  var input = document.getElementById('track');
  var msg = document.getElementById('msg');
  var KEY = 'zivox_last_tracking';

  // رجّع آخر رابط حطه الزبون
  try { var saved = localStorage.getItem(KEY); if (saved) input.value = saved; } catch(e){}

  function showError(t){ msg.textContent = t; }

  function track(){
    showError('');
    var v = input.value.trim();
    if (!v){ showError('حط رابط التتبع أو رقم الشحنة أول.'); input.focus(); return; }

    var url;
    if (/^https?:\/\//i.test(v)) {
      url = v;
    } else if (/^[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(v)) {
      url = 'https://' + v;               // رابط بدون https
    } else if (/^[A-Za-z0-9-]{8,40}$/.test(v)) {
      url = 'https://t.17track.net/en#nums=' + encodeURIComponent(v); // رقم شحنة
    } else {
      showError('الرابط أو الرقم مش واضح. تأكد إنك نسخته كامل.');
      return;
    }

    try { localStorage.setItem(KEY, v); } catch(e){}
    window.open(url, '_blank', 'noopener');
  }

  document.getElementById('goBtn').addEventListener('click', track);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') track(); });

  document.getElementById('pasteBtn').addEventListener('click', function(){
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function(t){
        input.value = t.trim(); input.focus();
      }).catch(function(){ showError('ما قدرت ألصق تلقائي، الصق الرابط يدوي.'); });
    } else {
      showError('الصق الرابط يدوي بالخانة.');
    }
  });
})();
</script>
</body>
</html>
